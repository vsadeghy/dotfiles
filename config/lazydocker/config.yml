customCommands:
  containers:
    - name: bash
      attach: true
      command: "docker exec -it {{ .Container.ID }} bash"
      serviceNames: []
    - name: sh
      attach: true
      command: "docker exec -it {{ .Container.ID }} sh"
      serviceNames: []
  images:
    - name: bash
      attach: true
      command: "docker run --env-file .env --rm -it --entrypoint bash {{ .Image.Name }}"
    - name: sh
      attach: true
      command: "docker run --env-file .env --rm -it --entrypoint sh {{ .Image.Name }}"
