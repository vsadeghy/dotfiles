# unbind-key -a

bind R source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded!"

bind ^X lock-server
bind ^D detach

bind - split-window -v
bind | split-window -h
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# bind -n m-j select-window -n
# bind -n m-k select-window -p
# bind -n m-l switch-client -n
# bind -n m-; switch-client -p

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(n?vim|vimx?)'"
bind -n M-Up if-shell "$is_vim" "send-keys M-Up" "select-pane -U"
bind -n M-Down if-shell "$is_vim" "send-keys M-Down" "select-pane -D"
bind -n M-Left if-shell "$is_vim" "send-keys M-Left" "select-pane -L"
bind -n M-Right if-shell "$is_vim" "send-keys M-Right" "select-pane -R"
bind -n M-k if-shell "$is_vim" "send-keys M-Up" "select-pane -U"
bind -n M-j if-shell "$is_vim" "send-keys M-Down" "select-pane -D"
bind -n M-h if-shell "$is_vim" "send-keys M-Left" "select-pane -L"
bind -n M-l if-shell "$is_vim" "send-keys M-Right" "select-pane -R"

bind -n m-tab    select-window -n
bind -n m-btab   select-window -p
bind -n m-c-tab  switch-client -n
bind -n m-c-btab switch-client -p
bind -n m-1      select-window -t 1
bind -n m-2      select-window -t 2
bind -n m-3      select-window -t 3
bind -n m-4      select-window -t 4

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi M send -X reverse-search-history

bind : command-prompt
bind q kill-pane
bind x kill-window
bind n swap-pane -D
bind c new-window # -c "$HOME"
bind C new-window -c "#{pane_current_path}"
bind r command-prompt "rename-window '%%'"
bind S choose-session
bind * setw synchronize-panes
# bind * set pane-border-status

bind o run-shell "tmux neww siscon"

bind -n M-Enter resize-pane -Z
