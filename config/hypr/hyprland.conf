# https://wiki.hyprland.org/Configuring/
autogenerated = 0

# [monitor],(resolution=)preferred,(offset=)auto,(scale=)auto
monitor=DP-2, 1920x1080@144.00, 1280x0, 1
monitor=HDMI-A-1, 1280x1024@75.00, 0x0, 1
workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2

$terminal = ghostty
$fileManager = pcmanfm
$menu = rofi -modi drun -show drun -config ~/.config/rofi/rofidmenu.rasi

exec-once = systemctl --user start hyprpolkitagent
# exec-once = nm-applet &
# exec-once = blueman-applet &
exec-once = waybar
exec-once = /usr/lib/nekoray/nekobox -tray -appdata
exec-once = clipse --listen

windowrule = float,class:(clipse)
windowrule = size 622 652,class:(clipse)
windowrule = stayfocused,class:(clipse)
bind = SUPER, V, exec, alacritty --class clipse -e 'clipse'

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

env = WLR_RENDERER,vulkan
env = WLR_NO_HARDWARE_CURSORS,1
env = GBM_BACKEND,nvidia-drm
env = GSK_RENDERER,ngl

general {
    gaps_in = 6
    gaps_out = 3
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    allow_tearing = true
    layout = dwindle # dwindle/master
}

decoration {
    rounding = 19
    active_opacity = 1
    inactive_opacity = 1

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = 0xffa7caff #86AAEC
        color_inactive = 0x50000000
        # color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size   = 2
        passes = 3
        new_optimizations = true
    }
}
blurls=waybar

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

dwindle:preserve_split = true


# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,ir
    kb_options = fkeys:basic_13_24, grp:alts_toggle, caps:escape, compose:menu
    follow_mouse = 1 # 0 - disabled, 1 - follow mouse, 2 - follow w/ click keyboard, 3 - follow w/ separate keyboard
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    touchpad {
        natural_scroll = false
    }
}

$mod = SUPER
$meh = CTRL ALT SHIFT

# https://wiki.hyprland.org/Configuring/Binds/ (/#submaps)
# bind[flags] = MODS, KEY, [DESC,] CMD, ARG
# flags: u: universal, c:click, d:description, e:repeat, g:drag, i:ignore (ignore mods), l:lock, m:mouse (LMB:272, RMB:273, MMB:274)
# n:noncosuming (key/mouse events alongside trigger) o:longpress, p:bypass s:separate (either keyA&keyB) r:release, t:transparent,
bind = $mod, return, exec, $terminal
bind = $mod, q, killactive,
bind = $mod CTRL, q, exec, hyprctl kill
bind = $mod SHIFT, x, exit,
bind = $meh, e, exec, zen-browser
bind = $meh, o, exec, obsidian
bind = $mod, Space, togglefloating,
bind = $mod, f, fullscreen,
bind = $mod, d, exec, $menu
bind = $mod, slash, exec, rofi -show emoji
bind = $mod, m, togglesplit, # dwindle
bind = , PRINT, exec, hyprshot -m window -m active

# Move focus with mod + arrow keys
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Switch workspaces with mod + [0-9]
bind = $mod, j, workspace, 1
bind = $mod, k, workspace, 2
bind = $mod, l, workspace, 3
bind = $mod, semicolon, workspace, 4
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
binde = $mod, O, workspace, previous

# Move active window to a workspace with mod + CTRL + [0-9]
bind = $mod CTRL, j, movetoworkspace, 1
bind = $mod CTRL, k, movetoworkspace, 2
bind = $mod CTRL, l, movetoworkspace, 3
bind = $mod CTRL, semicolon, movetoworkspace, 4
bind = $mod CTRL, 1, movetoworkspace, 1
bind = $mod CTRL, 2, movetoworkspace, 2
bind = $mod CTRL, 3, movetoworkspace, 3
bind = $mod CTRL, 4, movetoworkspace, 4
bind = $mod CTRL, 5, movetoworkspace, 5
bind = $mod CTRL, 6, movetoworkspace, 6
bind = $mod CTRL, 7, movetoworkspace, 7
bind = $mod CTRL, 8, movetoworkspace, 8
bind = $mod CTRL, 9, movetoworkspace, 9
bind = $mod CTRL, 0, movetoworkspace, 10
bind = $mod CTRL, O, movetoworkspace, previous

bind = $mod, S, togglespecialworkspace, magic
bind = $mod CTRL, S, movetoworkspace, special:magic

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioStop, exec, playerctl stop
bindl = , XF86AudioPrev, exec, playerctl previous

# Example windowrule
windowrule = float,class:^(flameshot)$,title:^(flameshot)$
windowrule = suppressevent maximize, class:.*
# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
