XDG_CONFIG_HOME="$HOME/.config"
XDG_CACHE_HOME="$HOME/.local/cache"
XDG_DATA_HOME="$HOME/.local/share"
XDG_STATE_HOME="$HOME/.local/state"
XDG_RUNTIME_DIR="/run/user/$UID"

XDG_DATA_DIRS="$XDG_DATA_HOME/flatpak/exports/share:/usr/local/share:/usr/share"
PATH="$HOME/.local/bin:$PATH"

TERMINAL="foot"
EDITOR="nvim"
BROWSER="zen-browser"
PATH="$XDG_DATA_HOME/bob/nvim-bin:$PATH"

GNUPGHOME="$XDG_DATA_HOME/gnupg"

GTK_RC_FILES="$XDG_CONFIG_HOME/gtk-1.0/gtkrc"
GTK2_RC_FILES="$XDG_CONFIG_HOME/gtk-2.0/gtkrc"
QT_QPA_PLATFORMTHEME="qt5ct"

NVM_DIR="$XDG_DATA_HOME/nvm"
NPM_CONFIG_USERCONFIG="$XDG_CONFIG_HOME/npm/npmrc"
NODE_REPL_HISTORY="$XDG_DATA_HOME/node_repl_history"
PNPM_HOME="$XDG_DATA_HOME/pnpm"
PATH="$PATH:$PNPM_HOME/bin"

GOPATH="$XDG_DATA_HOME/go"
GOBIN="$HOME/.local/bin"
GHCUP_USE_XDG_DIRS=1
RUSTUP_HOME="$XDG_DATA_HOME/rustup"
CARGO_HOME="$XDG_DATA_HOME/cargo"
PYTHON_HISTORY="$XDG_STATE_HOME/python_history"
PYTHONPYCACHEPREFIX="$XDG_CACHE_HOME/python"
PYTHONUSERBASE="$XDG_DATA_HOME/python"
GRADLE_USER_HOME="$XDG_DATA_HOME/gradle"

MYSQL_HISTFILE="$XDG_DATA_HOME/mysql_history"
PSQLRC="$XDG_CONFIG_HOME/pg/psqlrc"
PSQL_HISTORY="$XDG_STATE_HOME/psql_history"
PGPASSFILE="$XDG_CONFIG_HOME/pg/pgpass"
PGSERVICEFILE="$XDG_CONFIG_HOME/pg/pg_service.conf"

ZDOTDIR="$XDG_CONFIG_HOME/zsh"
STARSHIP_CONFIG="$XDG_CONFIG_HOME/starship/starship.toml"
STARSHIP_CACHE="$XDG_CACHE_HOME/starship"

USERXSESSION="$XDG_CACHE_HOME/X11/xsession"
USERXSESSIONRC="$XDG_CACHE_HOME/X11/xsessionrc"
ALTUSERXSESSION="$XDG_CACHE_HOME/X11/Xsession"
ERRFILE="$XDG_CACHE_HOME/X11/xsession-errors"
XINITRC="$XDG_CONFIG_HOME/X11/xinitrc"
XSERVERRC="$XDG_CONFIG_HOME/X11/xserverrc"
XAUTHORITY="$XDG_RUNTIME_DIR/Xauthority"

MESA_GLSL_CACHE_DIR="$XDG_CACHE_HOME/mesa"
MESA_SHADER_CACHE_DIR="$XDG_CACHE_HOME/mesa_shader_cache"
__GL_SHADER_DISK_CACHE=0
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
__GL_SHADER_DISK_CACHE_PATH="$XDG_CACHE_HOME/GLCache"
LIBVA_DRIVER_NAME=nvidia
__GLX_VENDOR_LIBRARY_NAME=nvidia
CUDA_CACHE_PATH="$XDG_CACHE_HOME/nv"
# WLR_DRM_NO_ATOMIC=1
GSK_RENDERER=ngl

FFMPEG_DATADIR="$XDG_CONFIG_HOME/ffmpeg"
HISTFILE="$XDG_STATE_HOME/history"
HISTSIZE=5000
INPUTRC="$XDG_CONFIG_HOME/readline/inputrc"
RXVT_SOCKET="$XDG_RUNTIME_DIR/urxvtd"
_Z_DATA="$XDG_DATA_HOME/z"
PARALLEL_HOME="$XDG_CONFIG_HOME/parallel"
W3M_DIR="$XDG_STATE_HOME/w3m"
SCREENRC="$XDG_CONFIG_HOME/screen/screenrc"
SCREENDIR="$XDG_RUNTIME_DIR/screen"
SINGULARITY_CACHEDIR="$XDG_CACHE_HOME/singularity"

GTK_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
GLFW_IM_MODULE=ibus
_JAVA_OPTIONS="-Djava.util.prefs.userRoot=$XDG_CONFIG_HOME/java"

WGETRC="$XDG_CONFIG_HOME/wget/wgetrc"
mkdir -p "$XDG_DATA_HOME/wineprefixes"
WINEPREFIX="$XDG_DATA_HOME/wineprefixes/default"

PAGER="bat -plman"
MANPAGER="nvim +Man!"

TERMINFO="$XDG_DATA_HOME/terminfo"
TERMINFO_DIRS="$TERMINFO:/usr/share/terminfo"
