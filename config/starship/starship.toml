# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
palette = "catppuccin_macchiato"
format = """$hostname$directory$nodejs$character"""
right_format = """$all"""
command_timeout = 1000

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
style = "bold mauve"
ignore_branches = ['master', 'main']

[directory]
fish_style_pwd_dir_length = 3
truncation_symbol = '…/'
truncation_length = 1

[hostname]
format = "[$ssh_symbol$hostname]($style) "

[direnv]
disabled = false

[lua]
disabled = true

[nodejs]
disabled = false

[golang]
disabled = true

[package]
disabled = true

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
